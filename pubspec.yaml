name: employee_management_application_flutter_assessment
description: "Employee Management Application - Flutter Assessment"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # networking
  dio: ^5.9.0

  # state management
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1

  # firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2

  # local storage
  shared_preferences: ^2.5.3

  # image loading
  cached_network_image: ^3.4.1

  # ui
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
